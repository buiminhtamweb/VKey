[package]
name = "VKey-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vietnamese input method with GUI and tray icon for Linux X11."
homepage = "https://github.com/buiminhtamweb/VKey"
repository = "https://github.com/buiminhtamweb/VKey"
readme = "../../README.md"
default-run = "VKey-rs"

[dependencies]
keyboard-linux = { path = "../keyboard-linux" }
tracing.workspace = true
tracing-subscriber.workspace = true
vietnamese-core = { path = "../vietnamese-core" }
eframe = { version = "0.29", features = ["glow", "x11"] }
tray-icon = "0.19"
toml = "0.8"
dirs = "5.0"
serde = { workspace = true, features = ["derive"] }
unicode-segmentation = "1.13.3"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
